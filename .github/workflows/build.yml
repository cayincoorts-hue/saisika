name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        # TODO: add ubuntu-latest, windows-latest after fixing cross-platform packaging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build frontend
        run: |
          cd app/frontend
          npm ci
          npm run build

      - name: Package backend
        run: |
          pyinstaller --onedir --name saisca_backend \
            --add-data "app/backend/static:app/backend/static" \
            --hidden-import numpy.random._pickle \
            app/backend/main.py

      - name: Setup Electron
        run: |
          mkdir -p dist/saiska_backend
          cp -r dist/saiska_backend/* dist/saiska_backend/ 2>/dev/null || true
          cd electron && npm ci

      - name: Build macOS .dmg
        if: matrix.os == 'macos-latest'
        run: |
          cd electron
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .dmg
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: saisca-macos
          path: electron/release/*.dmg
