name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: saisca-backend-macos
            binary_name: saisca_backend
          - os: ubuntu-latest
            artifact_name: saisca-backend-linux
            binary_name: saisca_backend
          - os: windows-latest
            artifact_name: saisca-backend-windows
            binary_name: saisca_backend.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend
        run: |
          cd app/frontend
          npm ci
          npm run build

      - name: Build with PyInstaller
        run: |
          pyinstaller saisika.spec

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  build-electron:
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: saisca-backend-${{ matrix.os == 'macos-latest' && 'macos' || matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
          path: dist/

      - name: Install Electron deps
        run: |
          cd electron
          npm ci

      - name: Build Electron app
        run: |
          cd electron
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: saisca-${{ matrix.os }}
          path: electron/release/*.{dmg,exe,AppImage,deb,snap}
